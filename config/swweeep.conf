# Name
CONFIG_ZMK_KEYBOARD_NAME="Swweeep"

# Sleep after 90 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=5400000
CONFIG_ZMK_SLEEP=y

# Improve range of BT radio, thus reducing interference when halves are spread apart
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE connection improvements
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Mouse config, requires PR #778
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_MOUSE_TICK_DURATION=8


#this is all new
# Enable the display
CONFIG_ZMK_DISPLAY=y

# Use the built-in status screen widgets
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Optional: If you want to see the layer name instead of just a number
# Note: This requires a fairly recent ZMK version
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
